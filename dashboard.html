<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - LeadsFlow</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="app-header-content">
                <h1 class="app-logo">LeadsFlow</h1>
                <div class="app-header-user">
                    <span id="user-email" class="user-email"></span>
                    <button id="logout-btn" class="btn btn-secondary">Cerrar Sesión</button>
                </div>
            </div>
        </header>

        <!-- Main -->
        <main class="app-main">
            <div class="app-main-header">
                <h2>Mis Leads</h2>
                <button id="new-lead-btn" class="btn">+ Nuevo Lead</button>
            </div>

            <!-- Lista de leads -->
            <div id="leads-container" class="leads-container">
                <div class="empty-state">
                    <p>Aún no tienes leads registrados.</p>
                    <p class="text-muted">Crea tu primer lead para empezar a usar LeadsFlow.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        initDashboard();
    </script>
</body>
</html>
