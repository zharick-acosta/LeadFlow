<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos - LeadsFlow</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card auth-card-wide">
            <h1>Contáctanos</h1>
            <p class="form-intro">Cuéntanos sobre tu proyecto y te contactaremos pronto.</p>

            <form id="public-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre *</label>
                        <input type="text" id="nombre" class="input" required>
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido *</label>
                        <input type="text" id="apellido" class="input" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" class="input" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" class="input">
                </div>

                <div class="form-group">
                    <label for="empresa">Empresa</label>
                    <input type="text" id="empresa" class="input">
                </div>

                <div class="form-group">
                    <label for="servicio">¿Qué servicio te interesa?</label>
                    <input type="text" id="servicio" class="input" placeholder="Ej: Diseño web, Marketing, Redes sociales...">
                </div>

                <div class="form-group">
                    <label for="notas">Cuéntanos más</label>
                    <textarea id="notas" class="input" rows="4" placeholder="Describe brevemente lo que necesitas..."></textarea>
                </div>

                <button type="submit" class="btn btn-block" id="submit-btn">Enviar</button>
            </form>

            <p class="footer-brand">Powered by LeadsFlow</p>
        </div>
    </div>

    <div id="notifications-container" class="notifications-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/form.js"></script>
</body>
</html>
